name: cabal

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  fourmolu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  build:
    runs-on: ubuntu-latest
    needs: fourmolu
    strategy:
      matrix:
        cabal: ["latest"]
        ghc: ["8.10.7", "9.0.2", "9.2.8", "9.4.8", "9.6", "9.8", "9.10", "9.12"]
        package:
          - "keyed-vals"
          - "keyed-vals-redis"
          - "keyed-vals-mem"
        exclude:
          - package: "keyed-vals-redis"
            ghc: "8.10.7"
          - package: "keyed-vals-redis"
            ghc: "9.0.2"
          - package: "keyed-vals-redis"
            ghc: "9.2.8"
          - package: "keyed-vals-redis"
            ghc: "9.4.8"
        include:
          - ghc: "8.10.7"
            project: "--project-file=cabal.project.no-redis"
          - ghc: "9.0.2"
            project: "--project-file=cabal.project.no-redis"
          - ghc: "9.2.8"
            project: "--project-file=cabal.project.no-redis"
          - ghc: "9.4.8"
            project: "--project-file=cabal.project.no-redis"
    env:
      CONFIG: "--enable-tests --enable-benchmarks --flags=build-the-readme"
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        id: setup-haskell-cabal
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}
      - run: cabal update
      - run: cabal freeze ${{ matrix.project }} $CONFIG
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-${{ matrix.ghc }}-${{ matrix.package }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.ghc }}-${{ matrix.package }}-
      - run: cabal build ${{ matrix.package }} ${{ matrix.project }} $CONFIG
      - run: cabal test ${{ matrix.package }} ${{ matrix.project }} $CONFIG
      - run: cabal haddock ${{ matrix.package }} ${{ matrix.project }} $CONFIG

  build-latest:
    runs-on: ubuntu-latest
    needs: fourmolu
    env:
      CONFIG: "--enable-tests --enable-benchmarks --flags=build-the-readme"
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12"
          cabal-version: "latest"
      - run: cabal update
      - run: cabal build all $CONFIG
      - run: cabal test all $CONFIG
